name: Kizil Elma Mobil 1.0 Offline APK

on:
  push:
    branches: [v1.0-offline-clean]
    paths:
      - "fresh-android/**"
      - ".github/workflows/kizil-elma-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install native toolchain
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found at $SDKMANAGER"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "::error::sdkmanager license acceptance failed with exit code $LICENSE_STATUS"
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

          NDK_HOME="$SDK_ROOT/ndk/27.0.12077973"
          CMAKE_HOME="$SDK_ROOT/cmake/3.22.1"

          test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -f "$NDK_HOME/build/cmake/android.toolchain.cmake"
          test -x "$CMAKE_HOME/bin/cmake"

          {
            echo "ANDROID_NDK_HOME=$NDK_HOME"
            echo "ANDROID_NDK_ROOT=$NDK_HOME"
            echo "ANDROID_NDK=$NDK_HOME"
            echo "CMAKE_HOME=$CMAKE_HOME"
          } >> "$GITHUB_ENV"
          echo "$CMAKE_HOME/bin" >> "$GITHUB_PATH"
          echo "Installed NDK: $NDK_HOME"
          "$CMAKE_HOME/bin/cmake" --version
      - name: Fetch llama.cpp source for native compilation
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp fresh-android/app/src/main/cpp/llama.cpp
      - name: Compile and test
        working-directory: fresh-android
        run: |
          set -euo pipefail
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          gradle --no-daemon --stacktrace :app:clean :app:testDebugUnitTest :app:assembleDebug
      - name: Package APK
        if: success()
        working-directory: fresh-android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Expected APK not found or empty: $APK"
            find app/build/outputs/apk -maxdepth 4 -type f -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p ../dist
          cp "$APK" ../dist/KizilElmaMobil-1.0-debug.apk
          test -s ../dist/KizilElmaMobil-1.0-debug.apk
          sha256sum ../dist/KizilElmaMobil-1.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KizilElmaMobil-1.0-debug-apk
          path: dist/KizilElmaMobil-1.0-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kizil-elma-v1.0-build-${{ github.run_number }}
          name: Kızıl Elma Mobil 1.0 (Build ${{ github.run_number }})
          body: |
            Kızıl Elma Mobil 1.0
            Version Code: 1
            Offline-first APK. GGUF and Vosk model files must be imported locally.
          files: dist/KizilElmaMobil-1.0-debug.apk
          fail_on_unmatched_files: true
          make_latest: false
