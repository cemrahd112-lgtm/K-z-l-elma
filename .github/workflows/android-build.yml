name: Build Kizil Elma Android 0.7.0 APK

on:
  push:
    branches:
      - v0.6.4-ui
    paths:
      - "KizilElmaMobil_0.6.4-chat-ui-source.zip"
      - ".github/workflows/android-build.yml"
      - ".github/patches/patch_0_7_0.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Extract existing Android source baseline
        run: |
          test -f KizilElmaMobil_0.6.4-chat-ui-source.zip
          mkdir -p kizil-work
          unzip -q KizilElmaMobil_0.6.4-chat-ui-source.zip -d kizil-work
          test -f kizil-work/gradlew
          chmod +x kizil-work/gradlew

      - name: Apply v0.7.0 major update
        run: |
          cp .github/patches/patch_0_7_0.py kizil-work/patch_0_7_0.py
          cd kizil-work
          python3 -m py_compile patch_0_7_0.py
          python3 patch_0_7_0.py
          grep -q 'versionCode = 21' app/build.gradle.kts
          grep -q 'versionName = "0.7.0"' app/build.gradle.kts
          grep -q 'SpeechRecognizer.createOnDeviceSpeechRecognizer(this)' app/src/main/java/com/kizilelma/mobile/MainActivity.kt
          grep -q 'EXPECTED_SHA256' app/src/main/java/com/kizilelma/mobile/assistant/ModelDownloader.kt
          grep -q 'Theme.Material3.Dark.NoActionBar' app/src/main/res/values/styles.xml
          python3 -c "import xml.etree.ElementTree as E; from pathlib import Path; [E.parse(p) for p in Path('app/src/main').rglob('*.xml')]"

      - name: Run unit tests and build debug APK
        working-directory: kizil-work
        run: ./gradlew --no-daemon --stacktrace :app:clean :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KizilElmaMobil-0.7.0-debug
          path: kizil-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
