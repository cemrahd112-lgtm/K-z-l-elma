name: Build Kizil Elma Android 0.6.5 APK

on:
  push:
    branches:
      - v0.6.4-ui
    paths:
      - "KizilElmaMobil_0.6.4-chat-ui-source.zip"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Extract v0.6.4 Android source
        run: |
          test -f KizilElmaMobil_0.6.4-chat-ui-source.zip
          mkdir -p kizil-work
          unzip -q KizilElmaMobil_0.6.4-chat-ui-source.zip -d kizil-work
          test -f kizil-work/gradlew
          chmod +x kizil-work/gradlew

      - name: Fix LiteRT-LM Message text extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("kizil-work/app/src/main/java/com/kizilelma/mobile/assistant/LocalLlmEngine.kt")
          content = source.read_text()
          broken = "activeConversation.sendMessage(safePrompt).text.trim()"
          fixed = "activeConversation.sendMessage(safePrompt).toString().trim()"
          if broken not in content:
              raise SystemExit("Expected LiteRT-LM Message.text expression was not found; refusing an unverified patch")
          source.write_text(content.replace(broken, fixed, 1))
          print("Patched Message.text to Message.toString()")
          PY

      - name: Set version to 0.6.5 (versionCode 18)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("kizil-work/app/build.gradle.kts")
          s = p.read_text()
          if "versionCode = 17" not in s or 'versionName = "0.6.4"' not in s:
              raise SystemExit("Expected 0.6.4 version fields were not found; refusing an unverified patch")
          s = s.replace("versionCode = 17", "versionCode = 18", 1)
          s = s.replace('versionName = "0.6.4"', 'versionName = "0.6.5"', 1)
          p.write_text(s)
          print("Version set to 0.6.5 (18)")
          PY

      - name: Run unit tests and build debug APK
        working-directory: kizil-work
        run: ./gradlew --no-daemon --stacktrace :app:clean :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KizilElmaMobil-0.6.5-debug
          path: kizil-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
