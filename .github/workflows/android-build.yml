name: Build Kizil Elma Android APK

on:
  push:
    branches:
      - v0.6.4-ui
    paths:
      - "KizilElmaMobil_0.6.4-chat-ui-source.zip"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Extract v0.6.4 Android source
        run: |
          test -f KizilElmaMobil_0.6.4-chat-ui-source.zip
          mkdir -p kizil-work
          unzip -q KizilElmaMobil_0.6.4-chat-ui-source.zip -d kizil-work
          test -f kizil-work/gradlew
          chmod +x kizil-work/gradlew

      - name: Run unit tests and build debug APK
        working-directory: kizil-work
        run: ./gradlew --no-daemon --stacktrace :app:clean :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KizilElmaMobil-0.6.4-debug
          path: kizil-work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
